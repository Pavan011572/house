<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3D House Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen 3D stage with a drawing-title-block plaque top-left and a control dock at the bottom */
:root {
  --bg: #e7ecef;
  --panel: rgba(250, 252, 253, 0.88);
  --fg: #14212b;
  --muted: #55646f;
  --line: #b9c5cd;
  --accent: #1d5fb8;
  --accent-fg: #ffffff;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c;
    --panel: rgba(16, 25, 33, 0.86);
    --fg: #e6edf2;
    --muted: #98a8b4;
    --line: #2c3b47;
    --accent: #6fa8f2;
    --accent-fg: #08121c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c;
  --panel: rgba(16, 25, 33, 0.86);
  --fg: #e6edf2;
  --muted: #98a8b4;
  --line: #2c3b47;
  --accent: #6fa8f2;
  --accent-fg: #08121c;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
#app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }

.plaque, .dock {
  position: absolute;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.plaque { top: 12px; left: 0; right: 0; }
.dock { bottom: 12px; left: 0; right: 0; display: flex; flex-direction: column; gap: 8px; }

.plate {
  display: inline-block;
  pointer-events: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 12px 9px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.plate h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.plate p { margin: 3px 0 0; font: 400 11px/1.4 var(--font-mono); color: var(--muted); }

.hint { font: 400 11px/1.3 var(--font-mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; align-self: flex-start; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

.bar {
  pointer-events: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.views { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
button {
  font: 500 13px/1 var(--font-ui);
  letter-spacing: 0.02em;
  color: var(--fg);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 10px 6px;
  min-height: 38px;
  cursor: pointer;
}
.views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.toggles button { flex: 1 1 0; min-width: 0; border-color: var(--line); font-family: var(--font-mono); font-size: 12px; font-weight: 400; }
.toggles button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 500; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.walk { display: none; flex-direction: column; gap: 8px; }
.walk.on { display: flex; }
.rooms { display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; padding-bottom: 2px; scrollbar-width: none; }
.rooms::-webkit-scrollbar { display: none; }
.rooms button { flex: 0 0 auto; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.rooms button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.walkrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.stick { position: relative; flex: 0 0 auto; width: 128px; height: 128px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); touch-action: none; pointer-events: auto; user-select: none; -webkit-user-select: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.stick svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--accent); opacity: 0.92; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
.acts { display: flex; gap: 6px; pointer-events: auto; }
.acts button { width: 56px; height: 52px; min-height: 0; padding: 0; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; touch-action: none; user-select: none; -webkit-user-select: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.acts button svg { width: 24px; height: 24px; fill: none; stroke: var(--fg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.acts button.down { background: var(--accent); border-color: var(--accent); }
.acts button.down svg { stroke: var(--accent-fg); }
.acts #run { width: 68px; font-family: var(--font-mono); font-size: 13px; }
.acts #run[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 15px; }
</style>

<div id="app">
  <div id="stage"></div>
  <div id="fail" hidden>This browser could not start the 3D view. Try another browser or enable hardware acceleration.</div>
  <div class="plaque">
    <div class="plate">
      <h1>Ground Floor Cum Site Plan</h1>
      <p>House 31′6″ × 37′0″ · Site 43′4″ × 38′10½″ · Road to the south</p>
    </div>
  </div>
  <div class="dock">
    <div class="walk" id="walk">
      <div class="rooms" id="rooms" role="group" aria-label="Jump to a room">
        <button type="button" data-room="outside" aria-pressed="false">Outside</button>
        <button type="button" data-room="verandah" aria-pressed="false">Verandah</button>
        <button type="button" data-room="hall" aria-pressed="false">Hall</button>
        <button type="button" data-room="dining" aria-pressed="false">Dining</button>
        <button type="button" data-room="kitchen" aria-pressed="false">Kitchen</button>
        <button type="button" data-room="puja" aria-pressed="false">Puja</button>
        <button type="button" data-room="master" aria-pressed="false">M. Bedroom</button>
        <button type="button" data-room="child" aria-pressed="false">C. Bedroom</button>
      </div>
      <div class="walkrow">
        <div class="stick" id="stick" role="group" aria-label="Walking joystick">
          <svg viewBox="0 0 128 128" aria-hidden="true"><polyline points="54 20 64 11 74 20"/><polyline points="54 108 64 117 74 108"/><polyline points="20 54 11 64 20 74"/><polyline points="108 54 117 64 108 74"/></svg>
          <div class="knob" id="knob"></div>
        </div>
        <div class="side">
          <div class="hint" id="hint2">Joystick to walk · drag to look · tap the floor to go there</div>
          <div class="acts">
            <button type="button" id="turnL" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 6 6"/></svg></button>
            <button type="button" id="turnR" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a6 6 0 0 0-6 6"/></svg></button>
            <button type="button" id="run" aria-pressed="false">Run</button>
          </div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">Drag to orbit · pinch to zoom</div>
    <div class="bar">
      <div class="views" role="group" aria-label="Camera view">
        <button type="button" id="v-exterior" data-view="exterior" aria-pressed="true">Exterior</button>
        <button type="button" id="v-far" data-view="far" aria-pressed="false">Far</button>
        <button type="button" id="v-cutaway" data-view="cutaway" aria-pressed="false">Cutaway</button>
        <button type="button" id="v-top" data-view="top" aria-pressed="false">Plan</button>
        <button type="button" id="v-inside" data-view="inside" aria-pressed="false">Walk</button>
      </div>
      <div class="toggles" role="group" aria-label="Display options">
        <button type="button" id="t-roof" data-toggle="roof" aria-pressed="true">Roof</button>
        <button type="button" id="t-labels" data-toggle="labels" aria-pressed="true">Labels</button>
        <button type="button" id="t-furn" data-toggle="furn" aria-pressed="true">Furniture</button>
        <button type="button" id="t-eve" data-toggle="eve" aria-pressed="false">Evening</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  var wrap = document.getElementById('stage');
  var fail = document.getElementById('fail');
  if (typeof THREE === 'undefined' || !THREE.OrbitControls) { fail.hidden = false; return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { fail.hidden = false; return; }
  var phone = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, phone ? 1.5 : 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  wrap.appendChild(renderer.domElement);
  renderer.domElement.addEventListener('webglcontextlost', function (e) { e.preventDefault(); fail.hidden = false; });
  renderer.domElement.addEventListener('webglcontextrestored', function () { fail.hidden = true; });

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcfe2ef);
  scene.fog = new THREE.Fog(0xcfe2ef, 380, 1100);
  var camera = new THREE.PerspectiveCamera(40, 1, 0.3, 1600);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.09;

  /* ---------- units: 1 scene unit = 1 foot. x = east, z = south (toward road), y = up ---------- */
  var H = 10;            // wall height
  var TX = 0.75;         // exterior wall thickness (9 in)
  var TI = 0.4;          // interior wall thickness (4.5 in)

  var solids = [];       // wall footprints used for walk-through collision
  var cache = {};
  function mat(c, r) {
    var k = c + '|' + (r || 0.9);
    if (!cache[k]) cache[k] = new THREE.MeshStandardMaterial({ color: c, roughness: r || 0.9, metalness: 0 });
    return cache[k];
  }
  var glass = new THREE.MeshStandardMaterial({ color: 0xa7cfe8, roughness: 0.1, metalness: 0, transparent: true, opacity: 0.35, depthWrite: false });

  var gSite = new THREE.Group(), gStruct = new THREE.Group(), gRoof = new THREE.Group(), gFurn = new THREE.Group(), gLabels = new THREE.Group();
  scene.add(gSite, gStruct, gRoof, gFurn, gLabels);

  function B(g, xs, ys, zs, m, ns) {
    var sx = xs[1] - xs[0], sy = ys[1] - ys[0], sz = zs[1] - zs[0];
    if (sx <= 0.001 || sy <= 0.001 || sz <= 0.001) return null;
    var me = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
    me.position.set((xs[0] + xs[1]) / 2, (ys[0] + ys[1]) / 2, (zs[0] + zs[1]) / 2);
    me.receiveShadow = true;
    if (!ns) me.castShadow = true;
    if ((g === gStruct || g === gSite) && !ns && ys[0] < 4 && ys[1] > 1) solids.push([xs[0], xs[1], zs[0], zs[1]]);
    g.add(me);
    return me;
  }
  function Cyl(g, x, y0, z, r, h, m, seg) {
    var me = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 20), m);
    me.position.set(x, y0 + h / 2, z);
    me.castShadow = true; me.receiveShadow = true;
    g.add(me);
    return me;
  }
  function F(xs, ys, zs, c, r) { return B(gFurn, xs, ys, zs, mat(c, r || 0.7)); }

  /* wall along an axis. opens: [start, end, sill, top, isGlass] in absolute feet along the axis */
  function wall(g, axis, c, a0, a1, th, opens, m, h) {
    h = h || H;
    opens = (opens || []).slice().sort(function (p, q) { return p[0] - q[0]; });
    var cur = a0;
    function put(s, e, y0, y1) {
      if (e - s < 0.01 || y1 - y0 < 0.01) return;
      if (axis === 'x') B(g, [s, e], [y0, y1], [c - th / 2, c + th / 2], m);
      else B(g, [c - th / 2, c + th / 2], [y0, y1], [s, e], m);
    }
    opens.forEach(function (o) {
      put(cur, o[0], 0, h);
      put(o[0], o[1], 0, o[2]);
      put(o[0], o[1], o[3], h);
      if (o[4]) {
        if (axis === 'x') B(g, [o[0], o[1]], [o[2], o[3]], [c - 0.04, c + 0.04], glass, true);
        else B(g, [c - 0.04, c + 0.04], [o[2], o[3]], [o[0], o[1]], glass, true);
      }
      cur = o[1];
    });
    put(cur, a1, 0, h);
  }

  /* ---------- site ---------- */
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), mat(0xb4b7a2, 1));
  ground.rotation.x = -Math.PI / 2; ground.position.set(15, -2.04, 20); ground.receiveShadow = true; gSite.add(ground);
  var lawn = new THREE.Mesh(new THREE.PlaneGeometry(43.33, 45.5), mat(0x9bb386, 1));
  lawn.rotation.x = -Math.PI / 2; lawn.position.set(-2.5 + 43.33 / 2, -2.0, -1.75 + 45.5 / 2); lawn.receiveShadow = true; gSite.add(lawn);
  var road = new THREE.Mesh(new THREE.PlaneGeometry(2400, 15), mat(0x454a50, 1));
  road.rotation.x = -Math.PI / 2; road.position.set(15, -2.0, 51.5); road.receiveShadow = true; gSite.add(road);
  for (var d = -300; d < 330; d += 9) B(gSite, [d, d + 4.5], [-2.0, -1.97], [51.3, 51.7], mat(0xe9e6d8, 1), true);
  (function () {
    var c = document.createElement('canvas'); c.width = 512; c.height = 128;
    var x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0)'; x.clearRect(0, 0, 512, 128);
    x.fillStyle = '#d8d6cc'; x.font = '600 84px Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    if (x.letterSpacing !== undefined) x.letterSpacing = '14px';
    x.fillText('ROAD', 256, 66);
    var t = new THREE.CanvasTexture(c);
    var p = new THREE.Mesh(new THREE.PlaneGeometry(16, 4), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
    p.rotation.x = -Math.PI / 2; p.position.set(17, -1.95, 47.3); gSite.add(p);
  })();
  var wallPlaster = mat(0xd9d4c6, 1);
  B(gSite, [-3.1, -2.6], [-2, 2.2], [-2.3, 43.2], wallPlaster);      // west boundary
  B(gSite, [40.6, 41.1], [-2, 2.2], [-2.3, 43.2], wallPlaster);      // east boundary
  B(gSite, [-3.1, 41.1], [-2, 2.2], [-2.3, -1.8], wallPlaster);      // rear boundary
  B(gSite, [14, 41.1], [-2, 1.6], [42.7, 43.2], wallPlaster);        // front boundary, gate side left open
  B(gSite, [13.3, 14.3], [-2, 3.6], [42.4, 43.5], mat(0xc9c2b2, 1)); // gate pillar
  function tree(x, z, s) {
    solids.push([x - 0.4 * s, x + 0.4 * s, z - 0.4 * s, z + 0.4 * s]);
    Cyl(gSite, x, -2, z, 0.35 * s, 4.5 * s, mat(0x6b5441, 1), 8);
    [[0, 6.5, 0, 3], [1.4, 5.6, 0.6, 2.2], [-1.3, 5.9, -0.5, 2.3]].forEach(function (b) {
      var m = new THREE.Mesh(new THREE.SphereGeometry(b[3] * s, 14, 12), mat(0x5d8a4e, 1));
      m.position.set(x + b[0] * s, b[1] * s - 2, z + b[2] * s); m.castShadow = true; gSite.add(m);
    });
  }
  tree(36, 6, 1.2); tree(37, 22, 1.3); tree(34.5, 39, 1);
  // plinth, front landing, steps down to the gate path
  B(gStruct, [-2.2, 31.9], [-2, 0], [-0.3, 37.3], mat(0xa39d90, 1));
  B(gStruct, [2.3, 13], [-2, -0.5], [37.3, 38.4], mat(0xb0aa9d, 1));
  B(gStruct, [2.3, 13], [-2, -1.0], [38.4, 39.5], mat(0xb0aa9d, 1));
  B(gStruct, [2.3, 13], [-2, -1.5], [39.5, 40.6], mat(0xb0aa9d, 1));
  B(gSite, [2.3, 13.0], [-2, -1.97], [40.6, 43.2], mat(0xaaa699, 1), true);

  /* ---------- floors ---------- */
  function floor(x0, x1, z0, z1, c) { B(gStruct, [x0, x1], [0, 0.06], [z0, z1], mat(c, 0.55), true); }
  var wood = 0xc4996d, marble = 0xe4e0d6, tileB = 0xc7d8df, tileK = 0xa9b9bd;
  floor(0.8, 14.2, 0.8, 15, wood);              // master bedroom
  floor(20.4, 30.7, 0.8, 15, wood);             // C. bedroom
  floor(14.6, 20.0, 0.8, 9.0, tileB);           // toilet (top)
  floor(0.8, 8.7, 15.2, 19.8, tileB);           // toilet (lower)
  floor(9.1, 14.4, 15.2, 19.8, 0xd8c3a3);       // dressing
  floor(14.6, 20.0, 9.4, 15.2, marble);         // passage
  floor(14.6, 30.9, 15.2, 31.3, marble);        // hall
  floor(0.8, 14.6, 20.2, 28.0, marble);         // dining
  floor(7.5, 10.3, 28.0, 28.4, marble);         // dining to kitchen link
  floor(0.8, 10.3, 28.4, 36.5, tileK);          // kitchen
  floor(10.7, 14.7, 28.9, 33.2, 0xd2c4aa);      // puja
  floor(10.7, 15.1, 33.6, 36.5, 0xb9b3a6);      // entry passage
  floor(-1.8, 0.2, 15.2, 27.8, tileK);          // utility
  floor(15.3, 30.9, 31.7, 36.5, 0xc7b8a2);      // verandah

  /* ---------- walls ---------- */
  var E = mat(0xe3dac8, 1), I = mat(0xf4f0e8, 1);
  wall(gStruct, 'x', 0.4, 0, 31.5, TX, [[10, 13, 3, 7, 1], [21.5, 24.5, 3, 7, 1], [16, 18, 5.2, 7, 1]], E);                                  // north
  wall(gStruct, 'z', 0.4, 0, 36.7, TX, [[4, 8, 3, 7, 1], [21, 23.5, 3, 7, 1], [24.4, 26.8, 0, 7], [31, 34, 3.5, 7, 1]], E);                  // west
  wall(gStruct, 'z', 31.1, 0, 31.5, TX, [[5, 9, 3, 7, 1], [19, 23, 3, 7, 1], [26.5, 29.5, 3, 7, 1]], E);                                    // east
  wall(gStruct, 'x', 36.7, 0, 10.5, TX, [[3.5, 6.5, 3.5, 7, 1]], E);                                                                        // south (kitchen)
  // bedrooms, toilet, corridor
  wall(gStruct, 'z', 14.4, 0.8, 15, TI, [[11, 13.8, 0, 7]], I);
  wall(gStruct, 'z', 20.2, 0.8, 15, TI, [[6, 8.2, 0, 7], [11, 13.8, 0, 7]], I);   // C. bedroom: toilet door + corridor door
  wall(gStruct, 'x', 9.2, 14.4, 20.2, TI, [], I);   // toilet south wall closed; entry is from the C. bedroom
  wall(gStruct, 'x', 15.0, 0.8, 14.4, TI, [[10.5, 12.5, 0, 7]], I);
  wall(gStruct, 'x', 15.0, 20.2, 30.9, TI, [], I);
  // lower toilet, dressing
  wall(gStruct, 'z', 8.9, 15, 20, TI, [[16.2, 18.2, 0, 7]], I);
  wall(gStruct, 'x', 20.0, 0.8, 14.6, TI, [], I);
  wall(gStruct, 'z', 14.6, 15, 20, TI, [], I);
  // utility
  wall(gStruct, 'z', -2.0, 15, 28, TI, [[18, 22, 3.5, 7, 1]], E);
  wall(gStruct, 'x', 15, -2.2, 0.2, TI, [], E);
  wall(gStruct, 'x', 28, -2.2, 0.2, TI, [], E);
  // kitchen and puja
  wall(gStruct, 'x', 28.0, 0.8, 7.5, TI, [], I);
  wall(gStruct, 'z', 10.5, 28, 36.5, TI, [], I);
  wall(gStruct, 'x', 28.7, 10.5, 14.9, TI, [[11.2, 14.2, 0, 6.6]], I);
  wall(gStruct, 'z', 14.9, 28.7, 33.6, TI, [], I);
  wall(gStruct, 'x', 33.4, 10.5, 15.1, TI, [], I);
  // hall to verandah with main door (M/D)

  var d0 = pose('exterior'); camera.position.copy(d0.pos); controls.target.copy(d0.t); controls.update();
  requestAnimationFrame(frame);
})();
